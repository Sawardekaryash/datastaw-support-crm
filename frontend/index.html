<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Datastaw Support CRM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div>
            <h1>Datastaw Support CRM</h1>

            <p>
                Customer Support Ticket Management
            </p>
        </div>

    </header>


    <main class="container">


        <!-- Dashboard -->
        <section class="dashboard">

            <div class="stat-card">

                <h3>Total Tickets</h3>

                <p id="totalTickets">0</p>

            </div>


            <div class="stat-card">

                <h3>Open</h3>

                <p id="openTickets">0</p>

            </div>


            <div class="stat-card">

                <h3>In Progress</h3>

                <p id="progressTickets">0</p>

            </div>


            <div class="stat-card">

                <h3>Closed</h3>

                <p id="closedTickets">0</p>

            </div>

        </section>



        <!-- Create Ticket -->
        <section class="card">

            <h2>Create New Ticket</h2>


            <form id="ticketForm">


                <div class="form-grid">


                    <div>

                        <label>
                            Customer Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            required
                        >

                    </div>



                    <div>

                        <label>
                            Customer Email
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            required
                        >

                    </div>



                    <div class="full">

                        <label>
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            required
                        >

                    </div>



                    <div class="full">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="5"
                            required
                        ></textarea>

                    </div>


                </div>


                <button type="submit">
                    Create Ticket
                </button>


            </form>


            <div id="createMessage"></div>

        </section>



        <!-- Ticket List -->
        <section class="card">


            <div class="section-header">

                <h2>Tickets</h2>

                <button
                    type="button"
                    onclick="loadTickets()"
                >
                    Refresh
                </button>

            </div>



            <div class="filters">


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by ticket ID, customer, email..."
                    oninput="loadTickets()"
                >


                <select
                    id="statusFilter"
                    onchange="loadTickets()"
                >

                    <option value="">
                        All Status
                    </option>

                    <option value="Open">
                        Open
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Closed">
                        Closed
                    </option>

                </select>


            </div>



            <div id="ticketList">

                Loading tickets...

            </div>


        </section>



        <!-- Ticket Details -->
        <section
            class="card"
            id="detailsSection"
            style="display: none;"
        >

            <h2>Ticket Details</h2>


            <div id="ticketDetails"></div>


        </section>


    </main>


    <script src="app.js"></script>

</body>

</html>
